[package]
name = "diffutils"
description = "A CLI app for generating diff files"
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[workspace]
members = [
    "src/uu/*",
    "src/diffutils_core/",
]

default-members = [
    ".",
    "src/uu/*",
    "src/diffutils_core/",
]

[workspace.dependencies]
diffutils_core = { path = "src/diffutils_core" }
chrono = "0.4.38"
diff = "0.1.13"
itoa = "1.0.11"
regex = "1.10.4"
same-file = "1.0.6"
unicode-width = "0.2.0"
pretty_assertions = "1.4.0"
tempfile = "3.26.0"

[workspace.package]
categories = ["command-line-utilities"]
edition = "2021"
rust-version = "1.87.0"
homepage = "https://github.com/uutils/diffutils"
repository = "https://github.com/uutils/diffutils"
keywords = ["diffutils", "uutils", "cross-platform", "cli", "utility"]
license = "MIT OR Apache-2.0"
version = "0.5.0"

[lib]
name = "diffutilslib"
path = "src/lib.rs"

[[bin]]
name = "diffutils"
path = "src/main.rs"

[dependencies]
uu_cmp = { path = "src/uu/cmp" }
uu_diff = { path = "src/uu/diff" }
diffutils_core = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0.14"
divan = { version = "5.0.0", package = "codspeed-divan-compat" }
predicates = "3.1.0"
rand = "0.10.0"
regex = { workspace = true }
tempfile = { workspace = true }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# alias profile for 'dist'
[profile.dist]
inherits = "release"

[[bench]]
name = "bench_diffutils"
path = "benches/bench-diffutils.rs"
harness = false

[features]
# default = ["feat_bench_not_diff"]
# Turn bench for diffutils cmp off
feat_bench_not_cmp = []
# Turn bench for diffutils diff off
feat_bench_not_diff = []
